name: Windows Cross Compiled

on:
  push:
    branches-ignore:
      - 'dependabot/**'

  workflow_dispatch:

jobs:
  build_targets:
    name: Build target-variant image
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [win64]
        variant: [nonfree]
    steps:
      - name: Find out cpu info
        run: lscpu

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the newest Buildah release
        run: |
          curl -fsSL https://raw.githubusercontent.com/podman-container-tools-community/buildah/main/packaging/apt/buildah.sources |
          sudo tee /etc/apt/sources.list.d/buildah.sources
          sudo apt update
          sudo apt install buildah

      - name: Configure Buildah storage
        run: |
          mkdir -p "$HOME/.config/containers"

          cat > "$HOME/.config/containers/storage.conf" <<'EOF'
          [storage]
          driver = "overlay"
          EOF

      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.dodosolsollalasol }}

      - name: Generate Dockerfile
        run: ./generate.sh ${{ matrix.target }} ${{ matrix.variant }}

      - name: Image Name
        id: imagename
        run: |
          IMG="ghcr.io/${GITHUB_ACTOR,,}/${{ matrix.target }}-${{ matrix.variant }}"
          echo "image=${IMG/ /-}:latest" >> "$GITHUB_OUTPUT"
          echo "cache=${IMG/ /-}/cache" >> "$GITHUB_OUTPUT"

      - name: Build variant image
        id: build
        env:
          IMAGE: ${{ steps.imagename.outputs.image }}
          CACHE: ${{ steps.imagename.outputs.cache }}
        run: |
          STAGELOGS="$RUNNER_TEMP/stagelogs"
          BUILDAH_LOG="$RUNNER_TEMP/buildah.log"
          rm -rf "$STAGELOGS"
          mkdir -p "$STAGELOGS"
          # Tells run_stage that the log hand-over is available.
          touch "$STAGELOGS/.active"

          # Sole writer of stage logs to the console (one block per stage).
          utils/stagelog-printer.sh "$STAGELOGS" &
          PRINTER=$!

          # Buildah's own output goes to a file so nothing else can write to
          # the console while stage logs are being printed.
          set +e
          buildah build \
            --file Dockerfile \
            --tag "$IMAGE" \
            --layers \
            --squash \
            --format oci \
            --cache-from "$CACHE" \
            --cache-to "$CACHE" \
            --compression-format zstd \
            --compression-level 7 \
            --jobs=3 \
            --volume "$STAGELOGS:/stagelogs" \
            . > "$BUILDAH_LOG" 2>&1
          rc=$?
          set -e

          touch "$STAGELOGS/.finished"
          wait "$PRINTER"

          if (( rc == 0 )); then
            echo "::group::buildah output"
            cat "$BUILDAH_LOG"
            echo "::endgroup::"
          else
            echo "::error title=buildah build failed::exit code $rc"
            cat "$BUILDAH_LOG"
          fi
          exit "$rc"

      - name: Push image to GHCR
        uses: redhat-actions/push-to-registry@v3
        with:
          tags: ${{ steps.imagename.outputs.image }}
          extra-args: |
            --compression-format zstd
            --compression-level 7

  ffmpeg_latest:
    name: Get FFmpeg latest commit
    needs: build_targets
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.sha.outputs.ffmpeg_commit }}
    steps:
      - name: Get FFmpeg latest commit
        id: sha
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/FFmpeg/FFmpeg/commits/master --jq '.sha')
          echo "ffmpeg_commit=${sha}" >> "$GITHUB_OUTPUT"

  build_ffmpeg:
    name: Build ffmpeg
    needs: ffmpeg_latest
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [win64]
        variant: [nonfree, nonfree-shared]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build ffmpeg
        run: ./build.sh ${{ matrix.target }} ${{ matrix.variant }}
        env:
          FFMPEG_COMMIT: ${{ needs.ffmpeg_latest.outputs.commit }}

      - name: Replace spaces in artifact name
        id: artifact
        run: |
          REF="${{ matrix.target }}-${{ matrix.variant }}"
          echo "name=${REF// /-}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ steps.artifact.outputs.name }}
          path: artifacts/
          retention-days: 1
          archive: false
