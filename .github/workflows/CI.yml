name: Windows Cross Compiled

on:
  push:
    branches-ignore:
      - 'dependabot/**'

  workflow_dispatch:

jobs:
  build_targets:
    name: Build target-variant image
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [win64]
        variant: [nonfree]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.dodosolsollalasol }}

      - name: Generate Dockerfile
        run: ./generate.sh ${{ matrix.target }} ${{ matrix.variant }}

      - name: Image Name
        id: imagename
        run: |
          IMG="ghcr.io/${GITHUB_ACTOR,,}/${{ matrix.target }}-${{ matrix.variant }}"
          echo "repository=${IMG/ /-}" >> "$GITHUB_OUTPUT"
          echo "image=${IMG/ /-}:latest" >> "$GITHUB_OUTPUT"
          echo "cache=${IMG/ /-}/cache" >> "$GITHUB_OUTPUT"

      - name: Build variant image
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ steps.imagename.outputs.repository }}
          containerfiles: Dockerfile
          layers: true
          squash: true
          oci: true
          extra-args: |
            --cache-from ${{ steps.imagename.outputs.cache }}
            --cache-to ${{ steps.imagename.outputs.cache }}
            --jobs=4

      - name: Push image to GHCR
        uses: redhat-actions/push-to-registry@v3
        with:
          tags: ${{ steps.imagename.outputs.image }}
          extra-args: |
            --compression-format zstd
            --compression-level 7

  ffmpeg_latest:
    name: Get FFmpeg latest commit
    needs: build_targets
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.sha.outputs.ffmpeg_commit }}
    steps:
      - name: Get FFmpeg latest commit
        id: sha
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/FFmpeg/FFmpeg/commits/master --jq '.sha')
          echo "ffmpeg_commit=${sha}" >> "$GITHUB_OUTPUT"

  build_ffmpeg:
    name: Build ffmpeg
    needs: ffmpeg_latest
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [win64]
        variant: [nonfree, nonfree-shared]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.dodosolsollalasol }}

      - name: Build ffmpeg
        run: ./build.sh ${{ matrix.target }} ${{ matrix.variant }}
        env:
          FFMPEG_COMMIT: ${{ needs.ffmpeg_latest.outputs.commit }}

      - name: Replace spaces in artifact name
        id: artifact
        run: |
          REF="${{ matrix.target }}-${{ matrix.variant }}"
          echo "name=${REF// /-}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ steps.artifact.outputs.name }}
          path: artifacts/
          retention-days: 1
          archive: false
