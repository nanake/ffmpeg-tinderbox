name: I am Mita, Your Housekeeper # 家政婦のミタ

on:
  schedule:
    - cron: '0 23 * * TUE' # Runs at 08:00 Tokyo time every Wednesday ⌚
    - cron: '0 23 27 * *' # Runs at 08:00 Tokyo time on day-of-month 28 🗓️
    - cron: '0 23 14,30 * *' # Runs at 08:00 Tokyo time on 1st and 15th of the month 🗓️

  workflow_dispatch:
    inputs:
      prune_tags:
        description: 'Prune old releases'
        type: boolean
        default: false
      prune_pkgs:
        description: 'Prune untagged packages'
        type: boolean
        default: false
      prune_cache:
        description: 'Prune Buildah cache'
        type: boolean
        default: false

jobs:
  prune_old_releases:
    if: github.event.schedule == '0 23 * * TUE' || github.event.inputs.prune_tags == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prune old releases
        run: ./utils/prunetags.sh
        env:
          GH_TOKEN: ${{ github.token }}

  prune_untagged_pkgs:
    if: github.event.schedule == '0 23 27 * *' || github.event.inputs.prune_pkgs == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image_name: [fedora,base-win64,win64-nonfree]
    steps:
      - name: Prune untagged pkgs
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-untagged: true
          packages: ${{ matrix.image_name }}
          token: ${{ secrets.dodosolsollalasol }}

  prune_buildah_cache:
    if: github.event.schedule == '0 23 14,30 * *' || github.event.inputs.prune_cache == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Prune buildah cache
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-tagged: 380
          packages: win64-nonfree/cache
          token: ${{ secrets.dodosolsollalasol }}
